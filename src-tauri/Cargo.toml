[package]
name = "ryzer-cortex-ultra"
version = "1.0.0"
description = "RYZER CORTEX ULTRA - ASUS PN64 CS2 Booster & Windows Optimizer"
authors = ["RYZER CORTEX Team"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "system-tray", "dialog-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
