name: Native Windows build
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src-native/EvoNativeEngine/EvoNativeEngine.csproj --configuration Release
      - run: dotnet run --project src-native/EvoNativeEngine.Tests --configuration Release
      - run: dotnet publish src-native/EvoNativeEngine/EvoNativeEngine.csproj --configuration Release --runtime win-x64 --self-contained true -o native-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: EvoNativeEngine-win-x64
          path: native-artifact/
