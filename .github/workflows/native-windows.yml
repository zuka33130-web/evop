name: Native Windows build
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src-native/EvoNativeEngine/EvoNativeEngine.csproj --configuration Release
      - run: dotnet run --project src-native/EvoNativeEngine.Tests --configuration Release
      - run: dotnet publish src-native/EvoNativeEngine/EvoNativeEngine.csproj --configuration Release --runtime win-x64 --self-contained true -o native-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: EvoNativeEngine-win-x64
          path: native-artifact/
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: npm run lint
      - run: npm run build
  desktop:
    needs: [build, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: bun install --frozen-lockfile
      - run: ./scripts/Publish-EvoDesktop.ps1
      - run: ./scripts/Test-EvoDesktopPackage.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: EvoDesktop-win-x64
          path: dist-native/desktop-win-x64/
